services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kubeai
      POSTGRES_PASSWORD: kubeai
      POSTGRES_DB: kubeai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeai -d kubeai"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
